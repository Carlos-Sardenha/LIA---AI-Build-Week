<title>Painel do Jarvis</title>
<meta name="claude:viewport-fit-sides" content="cover">
<!--
  Painel do Jarvis — modelo da página (skill `checkin`, .claude/skills/checkin/SKILL.md).
  App de gestão de projetos com pele 8-bit: Início (check-in do dia), Minhas tarefas (Lista/Quadro/Gantt/Planilha),
  Entrada, Notificações, Projetos (visão geral, tarefas, módulos), Ciclos, Análises, Páginas, Ctrl+K e o Claude junto.

  COMO USAR:
  - painel.mjs copia este arquivo para System/checkin/checkin.html (git-ignored) e troca SÓ o JSON de
    <script id="painel-data"> pelo painel do vault (jarvis_painel) + agenda + proposta do dia.
  - Este modelo é ESTRUTURA (vai pro GitHub): os dados abaixo são fictícios (acme, beta, ana-lima).

  O QUE GRAVA NO VAULT (servidor local `jarvis-escrita`; sem ele, fila do db; sem db, copiar e colar):
  - tarefa: criar, concluir, reabrir, mover de prioridade (P1–P4) ou para Aguardando, editar título/prazo/projeto-cliente (ctx);
  - Check-in do dia, Anotações do dia, captura no Inbox/manual.
  O QUE FICA SÓ NESTE NAVEGADOR (localStorage, até o Mateus aprovar a gravação):
  - estado Backlog/A fazer/Fazendo, módulo, início, ciclo, subtarefa, bloqueios, rótulos, notas, módulos dos projetos,
    triagem da Entrada, visões salvas e notificações lidas.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Pixelify+Sans:wght@400;600&display=swap">
<style>
/* Layout: barra lateral fixa (navegação) + área principal (cabeçalho com visões e filtros, conteúdo) + painel lateral de detalhe.
   Visual único e deliberado: console 8-bit escuro, bordas de pixel, sem modo claro. */
:root {
  color-scheme: dark;
  --bg: #101030;
  --side: #0a0a1e;
  --panel: #1a1a40;
  --panel-2: #24245a;
  --line: #3a3a7c;
  --fg: #f0f0fc;
  --muted: #a8b0e0;
  --gold: #fc9838;
  --gold-2: #f8d878;
  --bad: #ff5a74;
  --ok: #6fd65e;
  --shadow: #000008;
  --meet: #3a4a8c;
  --client: #7a4a14;
  --s-backlog: #1f9e96;
  --s-todo: #5a72f0;
  --s-doing: #c86e14;
  --s-waiting: #c4489e;
  --s-done: #4aa83a;
  --pix: 'Press Start 2P', 'Courier New', monospace;
  --body: 'Pixelify Sans', 'Trebuchet MS', system-ui, sans-serif;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.35 var(--body); -webkit-font-smoothing: none; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--side); }
button, select, input, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px dashed var(--gold-2); outline-offset: 2px; }
a { color: var(--gold-2); }

.app { display: grid; grid-template-columns: 236px minmax(0, 1fr); height: 100%; }
.side { background: var(--side); border-right: 2px solid var(--line); overflow-y: auto; padding: 14px 10px 24px max(10px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 14px; }
.brand { display: flex; align-items: center; gap: 10px; padding: 4px 6px; font: 12px var(--pix); color: var(--gold-2); }
.searchbtn { display: flex; align-items: center; gap: 8px; width: 100%; padding: 8px 10px; background: var(--panel); border: 2px solid var(--line); color: var(--muted); cursor: pointer; text-align: left; }
.searchbtn kbd { margin-left: auto; font: 8px var(--pix); color: var(--muted); }
.nav { display: grid; gap: 2px; }
.nav h3 { font: 8px/1 var(--pix); color: var(--muted); margin: 10px 8px 6px; letter-spacing: .08em; }
.nav button { display: flex; align-items: center; gap: 10px; width: 100%; padding: 7px 8px; background: none; border: 0; border-left: 3px solid transparent; cursor: pointer; text-align: left; min-height: 36px; }
.nav button:hover { background: var(--panel); }
.nav button.on { background: var(--panel-2); border-left-color: var(--gold); }
.nav button .lbl { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nav .badge { font: 8px var(--pix); background: var(--gold); color: var(--shadow); padding: 3px 5px; }
.nav .sub { padding-left: 30px; font-size: 15px; color: var(--muted); min-height: 30px; }
.nav .sub.on { color: var(--fg); }
img.ico { width: 16px; height: 16px; image-rendering: pixelated; flex: none; }
.dot { width: 10px; height: 10px; flex: none; border: 2px solid var(--shadow); display: inline-block; }
.modo { font: 8px/1.6 var(--pix); padding: 8px; border: 2px solid var(--line); color: var(--muted); }
.modo.ok { border-color: var(--ok); color: var(--ok); } .modo.warn { border-color: var(--gold); color: var(--gold-2); }

.main { min-width: 0; overflow-y: auto; display: flex; flex-direction: column; }
.top { position: sticky; top: 0; z-index: 4; background: var(--bg); border-bottom: 2px solid var(--line); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 12px; display: grid; gap: 10px; }
.top-row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.crumbs { display: flex; align-items: center; gap: 8px; font: 11px/1.5 var(--pix); min-width: 0; flex: 1; }
.crumbs span { color: var(--muted); }
.menu-btn { display: none !important; }
.content { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 18px 48px; display: grid; gap: 18px; align-content: start; }

.btn { display: inline-flex; align-items: center; gap: 8px; font: 9px/1 var(--pix); padding: 9px 11px; min-height: 36px; background: var(--panel-2); border: 2px solid var(--line); cursor: pointer; white-space: nowrap; }
.btn:hover { border-color: var(--muted); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn.primary { background: var(--gold); color: var(--shadow); border-color: var(--shadow); box-shadow: 3px 3px 0 var(--shadow); }
.btn.primary:hover { background: var(--gold-2); }
.btn.primary:active { transform: translate(3px, 3px); box-shadow: none; }
.btn.small { padding: 6px 8px; min-height: 30px; font-size: 8px; }
.seg { display: inline-flex; border: 2px solid var(--line); }
.seg button { font: 8px/1 var(--pix); padding: 9px 10px; min-height: 34px; background: var(--panel); border: 0; border-right: 2px solid var(--line); cursor: pointer; }
.seg button:last-child { border-right: 0; }
.seg button.on { background: var(--gold); color: var(--shadow); }
select.f, input.f, textarea.f { background: var(--panel); border: 2px solid var(--line); padding: 6px 8px; min-height: 34px; font-size: 15px; max-width: 100%; }
textarea.f { width: 100%; resize: vertical; }
.filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.filters select.f { font-size: 14px; }
.filters .f.on { border-color: var(--gold); }
.chk { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; color: var(--muted); }

.box { background: var(--panel); border: 2px solid var(--line); padding: 14px; min-width: 0; }
.box h2, h2.h { font: 10px/1.5 var(--pix); margin: 0 0 10px; color: var(--gold-2); letter-spacing: .04em; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; }
.muted { color: var(--muted); }
.empty { color: var(--muted); font-size: 15px; margin: 0; }
.chip { display: inline-flex; align-items: center; gap: 4px; font-size: 13px; padding: 1px 6px; border: 2px solid var(--line); color: var(--muted); white-space: nowrap; }
.chip.cli { border-color: var(--gold); color: var(--gold-2); }
.tag { font: 8px/1 var(--pix); padding: 4px 6px; border: 2px solid currentColor; white-space: nowrap; }
.tag.ok { color: var(--ok); } .tag.risk { color: var(--gold-2); } .tag.late { color: var(--bad); } .tag.mut { color: var(--muted); }
.late-t { color: var(--bad); }
.bar { height: 10px; background: var(--panel-2); border: 2px solid var(--shadow); display: block; }
.bar i { display: block; height: 100%; background: var(--s-done); }
.local { font: 7px var(--pix); color: var(--muted); border: 1px dashed var(--muted); padding: 2px 4px; white-space: nowrap; }

.st { width: 14px; height: 14px; flex: none; border: 2px solid var(--c); position: relative; display: inline-block; vertical-align: middle; }
.st.backlog { --c: var(--s-backlog); border-style: dashed; }
.st.todo { --c: var(--s-todo); }
.st.doing { --c: var(--s-doing); background: linear-gradient(90deg, var(--c) 50%, transparent 50%); }
.st.waiting { --c: var(--s-waiting); }
.st.waiting::after { content: ""; position: absolute; inset: 2px 3px; border-left: 2px solid var(--c); border-right: 2px solid var(--c); }
.st.done { --c: var(--s-done); background: var(--c); }
.st.done::after { content: ""; position: absolute; left: 3px; top: 0; width: 3px; height: 7px; border: solid var(--shadow); border-width: 0 2px 2px 0; transform: rotate(45deg); }
.pri { display: inline-flex; align-items: flex-end; gap: 1px; height: 12px; flex: none; vertical-align: middle; }
.pri i { width: 3px; background: var(--line); }
.pri i:nth-child(1) { height: 4px; } .pri i:nth-child(2) { height: 7px; } .pri i:nth-child(3) { height: 10px; } .pri i:nth-child(4) { height: 12px; }
.pri.p4 i:nth-child(-n+1), .pri.p3 i:nth-child(-n+2), .pri.p2 i:nth-child(-n+3) { background: var(--muted); }
.pri.p1 i { background: var(--bad); }
.pri.none i { background: var(--line); height: 2px; }
.sid { font: 8px var(--pix); color: var(--muted); white-space: nowrap; }

/* Lista */
.group { border: 2px solid var(--line); background: var(--panel); }
.group-h { display: flex; align-items: center; gap: 10px; padding: 8px 12px; background: var(--panel-2); cursor: pointer; border: 0; width: 100%; text-align: left; }
.group-h .n { font: 8px var(--pix); color: var(--muted); }
.row { display: grid; grid-template-columns: 14px 14px minmax(80px, 1fr) auto; gap: 10px; align-items: center; padding: 8px 12px; border-top: 2px solid var(--bg); cursor: pointer; width: 100%; background: none; border-left: 0; border-right: 0; border-bottom: 0; text-align: left; }
.row:hover, .row.sel { background: var(--panel-2); }
.row .tt { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .meta { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; justify-content: flex-end; max-width: 45%; overflow: hidden; }
@media (max-width: 700px) { .row { grid-template-columns: 14px 14px minmax(0, 1fr); } .row .meta { display: none; } }
.mini { font-size: 13px; color: var(--muted); white-space: nowrap; }
.blk { color: var(--bad); font: 8px var(--pix); }
.rowwrap { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; border-top: 2px solid var(--bg); }
.rowwrap .row { border-top: 0; }
.rowwrap .btn { margin-right: 8px; }

/* Quadro */
.kanban { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(250px, 1fr); gap: 12px; overflow-x: auto; padding-bottom: 8px; align-items: start; }
.kcol { background: var(--panel); border: 2px solid var(--line); display: grid; gap: 8px; padding: 8px; align-content: start; min-height: 160px; }
.kcol.over { outline: 2px dashed var(--gold-2); }
.kcol-h { display: flex; align-items: center; gap: 8px; font: 9px/1.5 var(--pix); padding: 4px; }
.kcol-h .n { color: var(--muted); margin-left: auto; }
.card { background: var(--bg); border: 2px solid var(--line); padding: 8px 10px; display: grid; gap: 6px; cursor: pointer; text-align: left; width: 100%; }
.card:hover { border-color: var(--muted); }
.card .tt { overflow-wrap: anywhere; }
.card .meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.card.pend, .row.pend { opacity: .55; }

/* Gantt */
.gantt-wrap { overflow-x: auto; border: 2px solid var(--line); background: var(--panel); }
.gantt { display: grid; position: relative; }
.g-lbl { position: sticky; left: 0; z-index: 2; background: var(--panel); border-right: 2px solid var(--line); border-bottom: 1px solid var(--bg); padding: 6px 10px; display: flex; align-items: center; gap: 8px; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; height: 34px; }
.g-lbl.proj { font: 8px/1.4 var(--pix); color: var(--gold-2); background: var(--panel-2); }
.g-lbl.mod { color: var(--muted); padding-left: 18px; }
.g-lbl.task { padding-left: 28px; }
.g-cell { position: relative; border-bottom: 1px solid var(--bg); height: 34px; }
.g-head { position: sticky; top: 0; z-index: 3; background: var(--side); font: 7px var(--pix); color: var(--muted); height: 34px; }
.g-gb { position: absolute; top: 9px; height: 16px; border: 2px solid var(--shadow); cursor: pointer; padding: 0; }
.g-gb.modbar { top: 13px; height: 8px; background: var(--muted); cursor: default; }
.g-gb.projbar { top: 11px; height: 12px; background: var(--gold); cursor: default; }
.g-ms { position: absolute; top: 10px; width: 14px; height: 14px; transform: rotate(45deg); border: 2px solid var(--shadow); cursor: pointer; padding: 0; }
.g-today { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--bad); z-index: 1; pointer-events: none; }

/* Planilha */
.sheet-wrap { overflow-x: auto; border: 2px solid var(--line); }
table.sheet { border-collapse: collapse; width: 100%; min-width: 1080px; background: var(--panel); font-variant-numeric: tabular-nums; }
.sheet th { font: 8px var(--pix); color: var(--muted); text-align: left; padding: 10px 8px; background: var(--side); position: sticky; top: 0; }
.sheet td { border-top: 2px solid var(--bg); padding: 4px 6px; }
.sheet td input.f, .sheet td select.f { width: 100%; min-height: 30px; font-size: 14px; background: transparent; border-color: transparent; }
.sheet td input.f:hover, .sheet td select.f:hover, .sheet td .f:focus { border-color: var(--line); }

/* Check-in: faixa do dia */
.intent { width: 100%; border: 0; border-bottom: 2px dashed var(--line); background: transparent; padding: 4px 0 8px; font: 600 clamp(18px, 2.2vw, 22px)/1.3 var(--body); resize: none; overflow: hidden; }
.intent:focus { outline: none; border-bottom-color: var(--gold); }
.timeline-wrap { overflow-x: auto; padding-bottom: 4px; }
.timeline { position: relative; height: 118px; min-width: 620px; }
.tl-hour { position: absolute; top: 0; bottom: 0; border-left: 1px dashed var(--line); font: 7px var(--pix); color: var(--muted); padding-left: 4px; }
.tl-lane { position: absolute; left: 0; right: 0; height: 40px; }
.tl-lane.m { top: 18px; } .tl-lane.f { top: 66px; }
.tl-ev { position: absolute; top: 0; height: 40px; padding: 3px 6px; font-size: 13px; line-height: 1.15; overflow: hidden; border: 2px solid var(--shadow); background: var(--meet); }
.tl-ev b { display: block; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tl-ev small { font: 7px var(--pix); opacity: .85; }
.tl-ev.client { background: var(--client); color: var(--gold-2); }
.tl-ev.foco { background: var(--s-todo); cursor: pointer; text-align: left; }
.tl-ev.clash { background: var(--bad); color: var(--shadow); }
.tl-ev.out { opacity: .45; }
.tl-now, .tl-end { position: absolute; top: 14px; bottom: 0; border-left: 2px solid var(--bad); pointer-events: none; }
.tl-end { border-left-color: var(--gold); }
.tl-end span, .tl-now span { position: absolute; top: -14px; left: 3px; font: 7px var(--pix); white-space: nowrap; }
.tl-end span { color: var(--gold-2); } .tl-now span { color: var(--bad); }
.tl-gap { position: absolute; top: 0; height: 40px; border: 2px dashed transparent; background: none; padding: 0; }
.tl-gap:hover { border-color: var(--gold); cursor: copy; }
.legend { display: flex; flex-wrap: wrap; gap: 12px; font-size: 14px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { display: inline-block; width: 12px; height: 12px; border: 2px solid var(--shadow); }
.dayband { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 16px; }
@media (max-width: 860px) { .dayband { grid-template-columns: minmax(0, 1fr); } }
.top3 { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.slot { display: grid; grid-template-columns: 30px minmax(0, 1fr) auto; gap: 10px; align-items: center; border: 2px solid var(--line); padding: 8px 10px; background: var(--bg); min-height: 52px; }
.slot .n { font: 14px var(--pix); color: var(--gold); }
.slot.empty { border-style: dashed; color: var(--muted); font-size: 15px; }
.slot.drop { border-color: var(--gold); }
.slot .t { font-weight: 600; overflow-wrap: anywhere; cursor: pointer; }
.slot .m { font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
.slot select { font-size: 13px; margin-top: 4px; max-width: 100%; }
.ic { border: 2px solid var(--line); background: var(--panel); width: 30px; height: 30px; display: inline-grid; place-items: center; font-size: 13px; line-height: 1; cursor: pointer; padding: 0; }
.ic:hover { border-color: var(--muted); }
.risks { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.risk { padding: 7px 10px; font-size: 15px; background: var(--bg); border-left: 4px solid var(--gold); }
.risk.h { border-left-color: var(--bad); }
.week { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
@media (max-width: 700px) { .week { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.day { background: var(--bg); border: 2px solid var(--line); padding: 6px; min-height: 90px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.day.today { border-color: var(--gold); }
.day .h { font: 7px var(--pix); color: var(--muted); display: flex; justify-content: space-between; }
.day .it { font-size: 13px; line-height: 1.2; padding: 3px 5px; background: var(--panel); overflow-wrap: anywhere; }
.day .it.cl { color: var(--gold-2); }
.day .it.dl { color: var(--bad); }

/* Claude e anotações */
.msgs { display: flex; flex-direction: column; gap: 8px; max-height: 340px; overflow-y: auto; }
.msg { padding: 8px 10px; font-size: 15px; white-space: pre-wrap; overflow-wrap: anywhere; border: 2px solid var(--line); }
.msg.u { background: var(--panel-2); align-self: flex-end; max-width: 90%; }
.msg.a { background: var(--bg); }
.msg.s { font-size: 14px; color: var(--muted); border: 0; padding: 2px 0; }
.quick { display: flex; flex-wrap: wrap; gap: 6px; }
.ask { display: flex; gap: 6px; }
.notes { list-style: none; margin: 0; padding: 0; font-size: 15px; display: grid; gap: 4px; max-height: 180px; overflow-y: auto; }
.inline { display: flex; gap: 6px; flex-wrap: wrap; }
.inline .f { flex: 1; min-width: 0; }
.person { border-top: 2px solid var(--bg); padding-top: 8px; }
.person:first-child { border-top: 0; padding-top: 0; }
.person .nm { font: 8px/1.6 var(--pix); color: var(--gold-2); display: flex; justify-content: space-between; gap: 8px; }
.person ul { margin: 4px 0 0; padding-left: 18px; font-size: 15px; }

/* Painel de detalhe */
.peek { position: fixed; z-index: 8; top: 0; right: 0; bottom: 0; width: min(460px, 100%); background: var(--side); border-left: 3px solid var(--gold); box-shadow: -6px 0 0 var(--shadow); overflow-y: auto; padding: calc(14px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) calc(32px + env(safe-area-inset-bottom, 0px)) 18px; display: grid; gap: 14px; align-content: start; }
.peek-h { display: flex; align-items: center; gap: 8px; }
.peek-h .sid { flex: 1; }
.peek textarea.title { font: 600 20px/1.3 var(--body); background: transparent; border: 2px solid transparent; padding: 4px; width: 100%; resize: none; }
.peek textarea.title:hover, .peek textarea.title:focus { border-color: var(--line); }
.props { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 6px 10px; align-items: center; }
.props label { font: 8px/1.4 var(--pix); color: var(--muted); }
.props .f { width: 100%; }
.sect h4 { font: 8px var(--pix); color: var(--gold-2); margin: 0 0 8px; display: flex; gap: 8px; align-items: center; }
.sect ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.linkrow { display: flex; align-items: center; gap: 8px; background: none; border: 0; padding: 4px 0; cursor: pointer; text-align: left; width: 100%; }
.linkrow:hover .tt { text-decoration: underline; }
.linkrow .tt { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.hist li { font-size: 14px; color: var(--muted); display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: 8px; }

/* Modais */
.veil { position: fixed; inset: 0; z-index: 9; background: rgba(0, 0, 8, .7); display: grid; place-items: start center; padding: calc(10vh + env(safe-area-inset-top, 0px)) 16px 16px; }
.modal { width: min(620px, 100%); background: var(--side); border: 3px solid var(--fg); box-shadow: 6px 6px 0 var(--shadow); padding: 16px; display: grid; gap: 12px; max-height: 80vh; overflow-y: auto; }
.modal h2 { font: 10px var(--pix); margin: 0; color: var(--gold-2); }
.cmd input { width: 100%; font-size: 18px; }
.cmd ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.cmd li button { display: flex; align-items: center; gap: 10px; width: 100%; padding: 8px; background: none; border: 0; cursor: pointer; text-align: left; }
.cmd li button.on { background: var(--panel-2); outline: 2px solid var(--gold); }

  // ── Visões de tarefas ──

  function gantt(ts) {
    const ini = (t) => t.inicio || t.criado;

    const a = semana(datas[0]).inicio; let z = addD(semana(datas[datas.length - 1]).inicio, 6);

    for (const p of projs) {
      lg('proj', esc(p.titulo), p.inicio && p.prazo ? `<span class="g-gb projbar" style="left:${x(p.inicio)}px;width:${(dias(p.inicio, p.prazo) + 1) * W}px" data-tip="${esc(p.titulo + ' · ' + d2(p.inicio) + '–' + d2(p.prazo))}"></span>` : '');
      for (const m of [...modulos(p.id), { id: null, titulo: 'Sem módulo' }]) {

        if (modulos(p.id).length) lg('mod', esc(m.titulo), m.inicio && m.prazo ? `<span class="g-gb modbar" style="left:${x(m.inicio)}px;width:${(dias(m.inicio, m.prazo) + 1) * W}px" data-tip="${esc('Módulo ' + m.titulo + ' · ' + d2(m.inicio) + '–' + d2(m.prazo))}"></span>` : '');

        <div class="g-lbl proj" style="top:0;z-index:4;background:var(--side)">PROJETO / TAREFA</div><div class="g-head">${head}</div>

      </div></div>
      <p class="empty">Barra = início → prazo (início local ou data de criação) · losango = só prazo · linha vermelha = hoje (${d2(HOJE)}). Sem prazo não aparece.</p>`;

  function telaTarefas(titulo, escopo) {

  // ── Início: check-in do dia + visão do todo ──
  function clashes(b) { const a1 = toMin(b.inicio), a2 = toMin(b.fim); return agHoje().some((e) => toMin(e.inicio) < a2 && a1 < toMin(e.fim)); }
  function timeline() {
    const ini = toMin((D.expediente && D.expediente.inicio) || '09:00');
    const pts = [ini, toMin(S.fim), ...agHoje().flatMap((e) => [toMin(e.inicio), toMin(e.fim)]), ...S.blocos.flatMap((b) => [toMin(b.inicio), toMin(b.fim)])];
    const st = Math.floor(Math.min(...pts) / 60) * 60, en = Math.ceil(Math.max(...pts) / 60) * 60;
    const pct = (m) => ((m - st) / (en - st) * 100).toFixed(3) + '%';
    const w = (a, b) => ((b - a) / (en - st) * 100).toFixed(3) + '%';
    let h = '';
    for (let m = st; m <= en; m += 60) h += `<div class="tl-hour" style="left:${pct(m)}">${fmt(m)}</div>`;
    h += '<div class="tl-lane m">';
    for (const e of agHoje()) h += `<div class="tl-ev ${e.tipo === 'client' ? 'client' : ''}${toMin(e.inicio) >= toMin(S.fim) ? ' out' : ''}" style="left:${pct(toMin(e.inicio))};width:${w(toMin(e.inicio), toMin(e.fim))}" data-tip="${esc(e.inicio + '–' + e.fim + ' ' + e.titulo)}"><b>${esc(e.titulo)}</b><small>${esc(e.inicio)}</small></div>`;
    h += '</div><div class="tl-lane f">';
    const ocup = [...agHoje(), ...S.blocos].map((x) => [toMin(x.inicio), toMin(x.fim)]);
    for (let m = Math.max(st, ini); m + 30 <= Math.min(en, toMin(S.fim)); m += 30) {
      if (!ocup.some(([a, b]) => a < m + 30 && m < b)) h += `<button type="button" class="tl-gap" data-gap="${m}" style="left:${pct(m)};width:${w(m, m + 30)}" aria-label="Criar bloco ${fmt(m)}–${fmt(m + 30)}" data-tip="Criar bloco ${fmt(m)}–${fmt(m + 30)}"></button>`;
    }
    S.blocos.forEach((b, i) => {
      if (toMin(b.fim) <= toMin(b.inicio)) return;
      h += `<button type="button" class="tl-ev foco${clashes(b) ? ' clash' : ''}" data-bloco="${i}" style="left:${pct(toMin(b.inicio))};width:${w(toMin(b.inicio), toMin(b.fim))}" data-tip="${esc(b.inicio + '–' + b.fim + ' ' + b.rotulo + ' (clique para editar)')}"><b>${esc(b.rotulo || 'bloco')}</b><small>${esc(b.inicio)}–${esc(b.fim)}</small></button>`;
    });
    h += '</div>';
    h += `<div class="tl-end" style="left:${pct(toMin(S.fim))}"><span>FIM ${esc(S.fim)}</span></div>`;
    const nowP = SP({ hour: '2-digit', minute: '2-digit' }), nowIso = SP({ year: 'numeric', month: '2-digit', day: '2-digit' });
    if (nowIso === HOJE && toMin(nowP) > st && toMin(nowP) < en) h += `<div class="tl-now" style="left:${pct(toMin(nowP))}"><span>AGORA ${nowP}</span></div>`;
    const livre = Math.max(0, toMin(S.fim) - ini - agHoje().reduce((s, e) => s + Math.max(0, Math.min(toMin(e.fim), toMin(S.fim)) - Math.max(toMin(e.inicio), ini)), 0));
    return { html: h, sub: `${agHoje().length} reunião(ões) · ${Math.floor(livre / 60)}h${String(livre % 60).padStart(2, '0')} livres até ${S.fim} · ${S.blocos.length} bloco(s)` };
  }
  function riscosCalc() {
    const r = [];
    for (const b of S.blocos) if (clashes(b)) r.push(['h', `Bloco "${b.rotulo}" (${b.inicio}–${b.fim}) bate com reunião`]);
    for (const e of agHoje()) if (toMin(e.fim) > toMin(S.fim)) r.push(['h', `"${e.titulo}" termina ${e.fim}, depois do seu fim (${S.fim})`]);

  function ciclos() {

      const st = x.fim < HOJE ? 'Encerrado' : x.inicio > HOJE ? 'Próximo' : 'Atual';
      return `<button type="button" class="row ${x.id === c.id ? 'sel' : ''}" style="grid-template-columns:52px 110px minmax(0,1fr) 110px" data-ciclo="${x.id}"><span class="sid">${x.id}</span><span class="mini">${d2(x.inicio)}–${d2(x.fim)}</span><span class="bar"><i style="width:${pr.pct}%"></i></span><span class="mini" style="text-align:right">${st} · ${pr.f}/${pr.n}</span></button>`; }).join('')}</div>`;
    const ts = TS.filter((t) => cicloDe(t) === c.id);
    const corpo = telaTarefas(`<span>CICLOS /</span> ${c.id} · ${d2(c.inicio)}–${d2(c.fim)}`, 'ciclo');
    return `<p class="empty">Ciclo = semana útil. A tarefa entra pelo prazo (atrasada conta na semana atual) ou pela data de conclusão; dá para fixar o ciclo no detalhe ${LOCAL}. Concluídas ficam 7 dias no TODO.md.</p>` + lista + `<div class="grid2"><div class="box"><h2>BURNDOWN ${c.id}</h2>${burndown(c, ts)}</div>
        <div class="box"><h2>ESCOPO DO CICLO</h2><div class="hbars">${ESTADOS.map(([e, l]) => { const n = ts.filter((t) => t.estado === e).length, mx = Math.max(1, ts.length);
          return `<div class="hbar" data-tip="${esc(l)}: ${n} tarefa(s)"><span>${stIco(e)} ${esc(l)}</span><span class="trk"><i style="width:${n / mx * 100}%;background:${COR[e]}"></i></span><span class="v">${n}</span></div>`; }).join('')}</div>
          <p class="empty" style="margin-top:10px">${ts.filter(atrasada).length} atrasada(s) · ${ts.filter((t) => t.estado === 'waiting').length} aguardando alguém</p></div></div>` + corpo;
  }
  function burndown(c, ts) {
    const dd = [0, 1, 2, 3, 4].map((i) => addD(c.inicio, i)), n = ts.length;
    if (!n) return '<p class="empty">Ciclo sem tarefas.</p>';
    const W = 420, H = 200, L = 34, R = 56, Tp = 14, B = 28, iw = W - L - R, ih = H - Tp - B;
    const X = (i) => L + i * iw / 4, Y = (v) => Tp + ih - v / n * ih;
    const real = dd.filter((d) => d <= HOJE).map((d) => n - ts.filter((t) => t.estado === 'done' && t.feito && t.feito <= d).length);
    let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Burndown do ciclo ${c.id}: ${real.length ? real[real.length - 1] : n} de ${n} tarefas restantes">`;
    for (const v of [...new Set([0, Math.round(n / 2), n])]) s += `<line x1="${L}" x2="${W - R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L - 6}" y="${Y(v) + 4}" text-anchor="end">${v}</text>`;
    dd.forEach((d, i) => { s += `<text x="${X(i)}" y="${H - 8}" text-anchor="middle">${dow(d)} ${d.slice(8)}</text>`; });
    s += `<line x1="${X(0)}" y1="${Y(n)}" x2="${X(4)}" y2="${Y(0)}" stroke="var(--muted)" stroke-width="2" stroke-dasharray="5 4"/><text x="${X(4) + 6}" y="${Y(0) + 4}">ideal</text>`;
    if (real.length) {
      s += `<polyline fill="none" stroke="var(--gold)" stroke-width="2" points="${real.map((v, i) => `${X(i)},${Y(v)}`).join(' ')}"/>`;
      real.forEach((v, i) => { s += `<rect x="${X(i) - 5}" y="${Y(v) - 5}" width="10" height="10" fill="var(--gold)" stroke="var(--panel)" stroke-width="2"/>`; });
      const li = real.length - 1; s += `<text x="${X(li) + 8}" y="${Y(real[li]) - 8}" style="fill:var(--fg)">real ${real[li]}</text>`;
      real.forEach((v, i) => { s += `<rect x="${X(i) - iw / 8}" y="${Tp}" width="${iw / 4}" height="${ih}" fill="transparent" data-tip="${dow(dd[i])} ${d2(dd[i])}: ${v} restante(s) · ideal ${Math.round(n - n * i / 4)}"/>`; });
    }
    return `<div class="chart">${s}</svg></div><div class="legend"><span><i style="width:16px;height:0;border:0;border-top:2px dashed var(--muted)"></i>Ideal</span><span><i style="background:var(--gold)"></i>Real (restantes ao fim do dia)</span></div>`;

  function paginas() {
    const g = UI.pagina && (P.paginas || []).find((x) => x.id === UI.pagina);

    if (g) return `<article class="box reader"><span class="mini">${esc({ daily: 'Daily', nota: 'Nota', decisao: 'Decisão' }[g.tipo] || g.tipo)} · ${d2(g.data)} · somente leitura · trecho do vault</span><h1>${esc(g.titulo)}</h1>${mdTxt(g.corpo)}</article>`;
    return [['daily', 'DAILIES DA SEMANA'], ['decisao', 'DECISÕES RECENTES'], ['nota', 'NOTAS RECENTES']].map(([k, l]) => `<div class="box"><h2>${l}</h2>${(P.paginas || []).filter((x) => x.tipo === k).map((x) => `<button type="button" class="linkrow" data-pagina="${esc(x.id)}">${img('pagina', '#a8b0e0')}<span class="tt">${esc(x.titulo)}</span><span class="mini">${d2(x.data)}</span></button>`).join('') || '<p class="empty">Nada aqui.</p>'}</div>`).join('');

  function mdTxt(src) {
    const inl = (s) => esc(s).replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>').replace(/\[\[([^\]|#]+)(?:#[^\]|]*)?(?:\|([^\]]+))?\]\]/g, (_, id, al) => `<button type="button" class="wl" data-goto="${esc(id)}">${esc(al || nome(id))}</button>`);
    let h = '', ul = false;
    for (const l of String(src || '').split('\n')) {
      const li = l.match(/^\s*[-*]\s+(?:\[[ xX]\]\s+)?(.*)$/);
      if (li) { if (!ul) { h += '<ul>'; ul = true; } h += `<li>${inl(li[1])}</li>`; continue; }
      if (ul) { h += '</ul>'; ul = false; }
      const hd = l.match(/^#{1,4}\s+(.*)$/);
      if (hd) h += `<h3>${inl(hd[1])}</h3>`;
      else if (l.startsWith('> ')) h += `<blockquote>${inl(l.slice(2))}</blockquote>`;
      else if (l.trim()) h += `<p>${inl(l)}</p>`;
    }
    return h + (ul ? '</ul>' : '');

  function analises() {
    top('ANÁLISES');
    const sem = [-14, -7, 0].map((n) => semana(addD(HOJE, n)));
    const feitas = sem.map((w) => TS.filter((t) => t.estado === 'done' && t.feito && t.feito >= w.inicio && t.feito <= addD(w.inicio, 6)).length);
    const mx = Math.max(1, ...feitas);
    const W = 420, H = 190, L = 28, B = 26, Tp = 18, ih = H - Tp - B, bw = (W - L - 10) / sem.length;
    let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Tarefas concluídas por semana">`;
    for (const v of [...new Set([0, Math.ceil(mx / 2), mx])]) { const y = Tp + ih - v / mx * ih; s += `<line x1="${L}" x2="${W - 10}" y1="${y}" y2="${y}" stroke="var(--line)"/><text x="${L - 6}" y="${y + 4}" text-anchor="end">${v}</text>`; }
    sem.forEach((w, i) => { const v = feitas[i], h = v / mx * ih, x = L + i * bw + 10, y = Tp + ih - h, bwi = bw - 20;
      if (v) s += `<path d="M${x},${Tp + ih} V${y + Math.min(4, h)} q0,-4 4,-4 H${x + bwi - 4} q4,0 4,4 V${Tp + ih} Z" fill="${w.id === CIC.id ? 'var(--gold)' : 'var(--s-done)'}" data-tip="${w.id} (${d2(w.inicio)}–${d2(w.fim)}): ${v} concluída(s)${w.id === CIC.id ? ' · semana atual' : ''}"/>`;

  const REGRAS = 'Você é o Jarvis, assistente do Mateus (estagiário em transição para o time de Dados da wehandle) dentro do painel do dia. Responda em português, curto e direto, sem inventar fatos: use só os dados abaixo e, se tiver a ferramenta, buscar_vault. Ids entre colchetes são as tarefas do TODO. Para mudar o plano do dia chame aplicar_plano (o Mateus revisa e confirma na página; nada é gravado no vault por você). Critério do Top 3: prazo hoje/amanhã ou vencido com cliente esperando, compromisso com cliente/gestor, o que destrava outra pessoa. Blocos de foco só em horários livres da agenda, dentro do expediente, foco pesado de manhã, um bloco curto para cobranças.';

    if (d.entrada) { const it = (P.entrada || []).find((x) => x.id === d.entrada); if (d.st) LOC.ent[d.entrada] = d.st; else delete LOC.ent[d.entrada]; evento(`Entrada · ${it ? it.titulo : d.entrada} → ${d.st || 'pendente'}`, null); salvarLoc(); render(); return; }

    if (d.gap !== undefined) { const m = +d.gap; S.blocos.push({ inicio: fmt(m), fim: fmt(m + 60 <= toMin(S.fim) ? m + 60 : m + 30), rotulo: 'Foco', tarefa: null }); S.blocos.sort((a, b) => toMin(a.inicio) - toMin(b.inicio)); saveDraft(); render(); return; }

    if (d.out !== undefined) { S.top3.splice(+d.out, 1); saveDraft(); render(); return; }

    if (d.concluir) { const t = T(d.concluir); if (t) mudar(t, 'estado', 'done'); return; }

      const tit = ($('mod-tit').value || '').trim(); if (!tit) { $('mod-tit').focus(); return; }
      const id = tit.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'mod' + Date.now();

    if (t && d.addSub) { const v = $('pk-sub').value.trim(); if (v.length < 3) { $('pk-sub').focus(); return; } $('pk-sub').value = ''; await criar({ titulo: v, pai: t.id, projeto: t.projeto, cliente: t.projeto ? '' : t.cliente, prioridade: t.prioridade || 'P2', estado: 'todo', modulo: t.modulo, ciclo: t.ciclo }); hist(t.id, `Subtarefa criada: ${v}`); salvarLoc(); render(); return; }
    if (t && d.addBloq) { const v = $('pk-rel').value; if (!v) return; const o = loc(t.id); o.bloqueia = [...(o.bloqueia || []), v]; hist(t.id, `Passou a bloquear: ${txt(T(v)?.titulo)}`); hist(v, `Bloqueada por: ${txt(t.titulo)}`); salvarLoc(); render(); return; }
    if (t && d.desbloq) { const o = loc(t.id); o.bloqueia = (o.bloqueia || []).filter((x) => x !== d.desbloq); hist(t.id, `Deixou de bloquear: ${txt(T(d.desbloq)?.titulo)}`); salvarLoc(); render(); return; }
  });
  document.addEventListener('change', (e) => {

    const t = UI.peek && T(UI.peek);
    if (t && d.pk && d.pk !== 'titulo' && d.pk !== 'notas') { mudar(t, d.pk, el.value); return; }
  });
  let tmr = null;
  document.addEventListener('input', (e) => {
    const el = e.target;
    if (el.id === 'cmd-q') { cmdSel = 0; cmdRes(); return; }
    if (el.id === 'intencao') { S.intencao = el.value; grow(el); saveDraft(); return; }

  });
  document.addEventListener('submit', async (e) => {
    if (e.target.id !== 'form-nova') return;

  document.addEventListener('focusout', (e) => {

    if (el.id === 'cmd-q') {
      if (e.key === 'ArrowDown') { e.preventDefault(); cmdSel = Math.min(cmdSel + 1, cmdLista.length - 1); cmdRes(); }
      if (e.key === 'ArrowUp') { e.preventDefault(); cmdSel = Math.max(cmdSel - 1, 0); cmdRes(); }
      if (e.key === 'Enter') { e.preventDefault(); const r = cmdLista[cmdSel]; fecharModal(); r && r.fn(); }

    if (e.key === 'Enter') {

      if (el.id === 'pk-rot') { e.preventDefault(); const v = el.value.trim().toLowerCase().replace(/\s+/g, '-'); const t = T(UI.peek); if (v && t) { const o = loc(t.id); o.temas = [...new Set([...(o.temas || []), v])]; hist(t.id, `Rótulo adicionado: ${v}`); salvarLoc(); render(); setTimeout(() => $('pk-rot')?.focus(), 0); } return; }
