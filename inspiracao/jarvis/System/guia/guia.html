  Guia de uso do Jarvis (System/guia/guia.html) — publicado como Artifact e aberto
  no início de toda conversa (hook SessionStart → System/scripts/guia.mjs).

  COMO ATUALIZAR (skill `guia`, .claude/skills/guia/SKILL.md):
  - Edite SÓ o JSON de <script id="guia-data">. A página é renderizada a partir dele.
  - Texto aceita formatação inline mínima: **negrito**, `código` e [rótulo](https://url).
    Todo o resto é escapado.
  - Arquivo de ESTRUTURA (vai pro GitHub): nada de nomes reais de clientes/pessoas,
    ids reais ou dados sensíveis. Exemplos usam fictícios (acme, ana-lima).
  - Depois de editar: publicar no mesmo Artifact e `node System/scripts/guia.mjs gravar --url <url>`.
-->

<style>
/* Layout: manual de bolso — índice fixo à esquerda, seções empilhadas; comandos como fichas de terminal. */
:root{
  --bg:#f3f4f6; --surface:#ffffff; --surface-2:#e9ebf0; --text:#191b22; --muted:#5d6273;
  --border:#d9dce4; --accent:#2f4bd1; --accent-soft:#e3e8fb; --accent-ink:#ffffff;
  --term:#1b1e27; --term-ink:#e6e8ef; --term-dim:#8b91a6; --term-cmd:#9fb3ff;
  --ok:#1f7a4d; --ok-soft:#e1f2e8; --warn:#a15c00; --warn-soft:#fbefd9;
  --display:"Bricolage Grotesque",system-ui,"Segoe UI",sans-serif;
  --body:"IBM Plex Sans",system-ui,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  --radius:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#12141a; --surface:#1a1d25; --surface-2:#232733; --text:#e8eaf0; --muted:#9aa0b3;
    --border:#2e3240; --accent:#8ea2ff; --accent-soft:#232a48; --accent-ink:#10131f;
    --term:#0c0e13; --term-ink:#e6e8ef; --term-dim:#7d8398; --term-cmd:#a9bbff;
    --ok:#5fcf97; --ok-soft:#173022; --warn:#f0b35a; --warn-soft:#352612;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#12141a; --surface:#1a1d25; --surface-2:#232733; --text:#e8eaf0; --muted:#9aa0b3;
  --border:#2e3240; --accent:#8ea2ff; --accent-soft:#232a48; --accent-ink:#10131f;
  --term:#0c0e13; --term-ink:#e6e8ef; --term-dim:#7d8398; --term-cmd:#a9bbff;
  --ok:#5fcf97; --ok-soft:#173022; --warn:#f0b35a; --warn-soft:#352612;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--text);font:15.5px/1.6 var(--body);-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:var(--accent)}
code{font:.88em var(--mono);background:var(--surface-2);padding:.08em .35em;border-radius:5px}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;letter-spacing:-.01em}

.app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;overflow-y:auto;border-right:1px solid var(--border);background:var(--surface);padding:24px 14px}
.brand{font:600 11px/1 var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0 0 8px 10px}
.side h1{font-size:22px;margin:0 0 18px 10px}
.toc{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.toc a{display:block;padding:7px 10px;border-radius:8px;text-decoration:none;color:var(--text);font-size:14.5px}
.toc a:hover{background:var(--surface-2)}
.toc a.on{background:var(--accent-soft);font-weight:600}
.stamp{margin:22px 10px 0;font-size:12.5px;color:var(--muted);line-height:1.5}

.main{padding-block:36px 96px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:56px}
.hero h2{font-size:clamp(28px,4vw,38px);line-height:1.12;margin:0 0 12px}
.hero p{font-size:17px;color:var(--muted);margin:0;max-width:62ch}
.search{margin-top:22px;display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:10px 14px}
.search input{flex:1;min-width:0;border:0;background:none;font:16px var(--body);color:var(--text);outline:none}
.search kbd{font:12px var(--mono);color:var(--muted);border:1px solid var(--border);border-radius:5px;padding:1px 6px}
.count{font-size:13px;color:var(--muted);margin-top:8px;min-height:1.4em}

section h2{font-size:24px;margin:0 0 6px}
.sub{color:var(--muted);margin:0 0 20px;max-width:65ch}

/* Dia típico: linha do tempo real (horários das rotinas agendadas) */
.day{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.day li{display:grid;grid-template-columns:64px 18px minmax(0,1fr);gap:12px;align-items:start}
.day .t{font:500 14px/1.6 var(--mono);color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.day .rail{position:relative;align-self:stretch}
.day .rail::before{content:"";position:absolute;left:8px;top:0;bottom:0;width:2px;background:var(--border)}
.day li:first-child .rail::before{top:10px}
.day li:last-child .rail::before{bottom:calc(100% - 10px)}
.day .rail::after{content:"";position:absolute;left:3px;top:6px;width:12px;height:12px;border-radius:50%;background:var(--surface);border:2px solid var(--accent)}
.day .auto .rail::after{background:var(--accent)}
.day .body{padding-bottom:18px;min-width:0}
.day .body b{font-weight:600}
.day .body p{margin:2px 0 0;color:var(--muted)}
.pill{display:inline-block;font:500 11.5px/1 var(--body);letter-spacing:.03em;padding:4px 7px;border-radius:99px;vertical-align:2px;margin-left:6px}
.pill.auto{background:var(--accent-soft);color:var(--accent)}
.pill.manual{background:var(--surface-2);color:var(--muted)}
.pill.conf{background:var(--warn-soft);color:var(--warn)}
.pill.ro{background:var(--ok-soft);color:var(--ok)}

/* Fichas de comando */
.grp{display:flex;flex-direction:column;gap:14px}
.grp + .grp{margin-top:30px}
.grp h3{font-size:15px;font-family:var(--body);font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
.card-h{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:baseline;padding:14px 16px 4px}
.card-h .cmd{font:600 17px var(--mono);color:var(--accent)}
.card-h .args{font:14px var(--mono);color:var(--muted);min-width:0;overflow-wrap:anywhere}
.card-b{padding:4px 16px 14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.card-b p{margin:0}
.kv{display:grid;grid-template-columns:110px minmax(0,1fr);gap:4px 12px;font-size:14px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.term{background:var(--term);color:var(--term-ink);font:13.5px/1.6 var(--mono);padding:10px 12px 10px 14px;display:flex;flex-direction:column;gap:2px}
.term .ln{display:flex;gap:10px;align-items:center;min-width:0}
.term .ln span{flex:1;min-width:0;overflow-x:auto;white-space:pre}
.term .ln span::before{content:"› ";color:var(--term-dim)}
.term .ln em{font-style:normal;color:var(--term-cmd)}
.cp{flex:none;background:none;border:1px solid #3a3f50;color:var(--term-dim);border-radius:6px;font:12px var(--body);padding:2px 8px}
.cp:hover{color:var(--term-ink);border-color:var(--term-dim)}

/* Tabelas */
.tbl{overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:14.5px}
th,td{text-align:left;padding:10px 14px;border-bottom:1px solid var(--border);vertical-align:top}
th{font-weight:600;font-size:12.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);background:var(--surface-2)}
tr:last-child td{border-bottom:0}
td code{white-space:nowrap}

.rules{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.rules li{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px}
.rules b{display:block;margin-bottom:4px}
.rules p{margin:0;color:var(--muted);font-size:14.5px}
.hide{display:none!important}

@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:static;height:auto;border-right:0;border-bottom:1px solid var(--border);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .toc{flex-direction:row;flex-wrap:wrap}
  .stamp{display:none}
  .rules{grid-template-columns:minmax(0,1fr)}
  .kv{grid-template-columns:minmax(0,1fr)}
  .kv dt{margin-top:4px}
}
@media (prefers-reduced-motion:no-preference){ html{scroll-behavior:smooth} }
</style>

<script>
(function(){
  var D = JSON.parse(document.getElementById('guia-data').textContent);
  var root = document.getElementById('root');

  function esc(s){ return String(s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function md(s){
    return esc(s)
      .replace(/`([^`]+)`/g, '<code>$1</code>')
      .replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>')
      .replace(/\[([^\]]+)\]\((https:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  }
  function el(html){ var t = document.createElement('template'); t.innerHTML = html.trim(); return t.content.firstChild; }

  var secs = [
    {id:'dia', t:'Seu dia'}, {id:'comandos', t:'Comandos'}, {id:'perguntas', t:'Perguntas ao grafo'},
    {id:'fontes', t:'Fontes'}, {id:'regras', t:'Regras'}, {id:'pastas', t:'Onde fica o quê'}, {id:'terminal', t:'Terminal'}
  ];

  // Hero + busca
  root.appendChild(el('<header class="hero"><h2>Como usar o Jarvis</h2><p>' + md(D.intro) + '</p>' +
    '<label class="search" for="q"><input id="q" type="search" placeholder="Buscar comando, ferramenta ou palavra (ex.: compromisso, jira, reunião)" autocomplete="off"><kbd>/</kbd></label>' +
    '<div class="count" id="count" aria-live="polite"></div></header>'));

  // Seu dia
  var day = D.dia.map(function(d){
    return '<li class="' + (d.auto ? 'auto' : '') + '"><span class="t">' + esc(d.hora) + '</span><span class="rail"></span><div class="body"><b>' + esc(d.nome) + '</b> <code>' + esc(d.cmd) + '</code>' +
      '<span class="pill ' + (d.auto ? 'auto">agendado' : 'manual">quando quiser') + '</span><p>' + md(d.faz) + '</p></div></li>';
  }).join('');
  root.appendChild(el('<section id="dia"><h2>Seu dia</h2><p class="sub">As rotinas rodam sozinhas nos horários abaixo (seg–sex). Você também pode chamar qualquer uma à mão.</p><ol class="day">' + day + '</ol></section>'));

  // Comandos
  var cmds = D.grupos.map(function(g){
    return '<div class="grp"><h3>' + esc(g.titulo) + '</h3>' + g.itens.map(function(c){
      var ex = (c.exemplos || []).map(function(x){
        return '<div class="ln"><span>' + esc(x).replace(/^(\/\S+)/, '<em>$1</em>') + '</span><button class="cp" type="button" data-copy="' + esc(x) + '">copiar</button></div>';
      }).join('');
      return '<article class="card" data-search="' + esc([c.cmd, c.args, c.resumo, c.quando, c.escreve, (c.exemplos||[]).join(' ')].join(' ').toLowerCase()) + '">' +
        '<div class="card-h"><span class="cmd">' + esc(c.cmd) + '</span>' + (c.args ? '<span class="args">' + esc(c.args) + '</span>' : '') +
        (c.conf ? '<span class="pill conf">pede seu "sim"</span>' : '') + '</div>' +
        '<div class="card-b"><p>' + md(c.resumo) + '</p><dl class="kv"><dt>Quando usar</dt><dd>' + md(c.quando) + '</dd><dt>Escreve em</dt><dd>' + md(c.escreve) + '</dd>' +
        (c.obs ? '<dt>Atenção</dt><dd>' + md(c.obs) + '</dd>' : '') + '</dl></div>' +
        (ex ? '<div class="term">' + ex + '</div>' : '') + '</article>';
    }).join('') + '</div>';
  }).join('');
  root.appendChild(el('<section id="comandos"><h2>Comandos</h2><p class="sub">Digite no chat do Claude Code, aberto na pasta do Jarvis. O que vem entre <code>&lt; &gt;</code> é obrigatório; entre <code>[ ]</code>, opcional.</p>' + cmds + '</section>'));

  // Perguntas ao grafo
  var rows = D.consultas.map(function(c){
    return '<tr data-search="' + esc((c.quero + ' ' + c.usar).toLowerCase()) + '"><td>' + md(c.quero) + '</td><td><code>' + esc(c.usar) + '</code></td></tr>';
  }).join('');
  root.appendChild(el('<section id="perguntas"><h2>Perguntas ao grafo</h2><p class="sub">Você não precisa chamar essas ferramentas pelo nome: pergunte em português (ou use <code>/consultar</code>) e o Jarvis escolhe. A tabela ajuda a saber o que dá para perguntar. Todas são <span class="pill ro">só leitura</span></p><div class="tbl"><table><thead><tr><th>Quando eu quiser</th><th>Ferramenta</th></tr></thead><tbody>' + rows + '</tbody></table></div></section>'));

  // Fontes
  root.appendChild(el('<section id="fontes"><h2>Fontes</h2><p class="sub">De onde vem o que entra no grafo. Todas são lidas, nenhuma é alterada.</p><div class="tbl"><table><thead><tr><th>Fonte</th><th>Como entra</th></tr></thead><tbody>' +
    D.fontes.map(function(f){ return '<tr data-search="' + esc((f.fonte + ' ' + f.como).toLowerCase()) + '"><td><b>' + esc(f.fonte) + '</b></td><td>' + md(f.como) + '</td></tr>'; }).join('') + '</tbody></table></div></section>'));

  // Regras
  root.appendChild(el('<section id="regras"><h2>Regras</h2><p class="sub">O que o Jarvis nunca faz, para você confiar no que ele escreve.</p><ul class="rules">' +
    D.regras.map(function(r){ return '<li data-search="' + esc((r.titulo + ' ' + r.texto).toLowerCase()) + '"><b>' + esc(r.titulo) + '</b><p>' + md(r.texto) + '</p></li>'; }).join('') + '</ul></section>'));

  // Pastas
  root.appendChild(el('<section id="pastas"><h2>Onde fica o quê</h2><p class="sub">Para abrir no Obsidian ou no editor quando quiser ver a fonte.</p><div class="tbl"><table><thead><tr><th>Pasta</th><th>Conteúdo</th></tr></thead><tbody>' +
    D.pastas.map(function(p){ return '<tr data-search="' + esc((p.pasta + ' ' + p.conteudo).toLowerCase()) + '"><td><code>' + esc(p.pasta) + '</code></td><td>' + md(p.conteudo) + '</td></tr>'; }).join('') + '</tbody></table></div></section>'));

  // Terminal
  root.appendChild(el('<section id="terminal"><h2>Terminal</h2><p class="sub">Comandos para rodar no PowerShell, na raiz do vault.</p><div class="tbl"><table><thead><tr><th>Comando</th><th>Faz</th></tr></thead><tbody>' +
    D.terminal.map(function(t){ return '<tr data-search="' + esc((t.cmd + ' ' + t.faz).toLowerCase()) + '"><td><code>' + esc(t.cmd) + '</code></td><td>' + md(t.faz) + '</td></tr>'; }).join('') + '</tbody></table></div></section>'));

  // Índice + carimbo
  var toc = document.getElementById('toc');
  secs.forEach(function(s){ toc.appendChild(el('<li><a href="#' + s.id + '" data-id="' + s.id + '">' + esc(s.t) + '</a></li>')); });
  var p = D.atualizado.split('-');
  document.getElementById('stamp').textContent = 'Atualizado em ' + p[2] + '/' + p[1] + '/' + p[0] + '. Regenerado pelo /guia quando comandos, prompts ou ferramentas mudam.';

  // Seção ativa no índice
  if ('IntersectionObserver' in window){
    var links = toc.querySelectorAll('a');
    var io = new IntersectionObserver(function(es){
      es.forEach(function(e){ if (e.isIntersecting){ links.forEach(function(a){ a.classList.toggle('on', a.dataset.id === e.target.id); }); } });
    }, {rootMargin:'-20% 0px -70% 0px'});
    secs.forEach(function(s){ var n = document.getElementById(s.id); if (n) io.observe(n); });
  }

  // Busca
  var q = document.getElementById('q'), count = document.getElementById('count');
  function norm(s){ return s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase(); }
  q.addEventListener('input', function(){
    var v = norm(q.value.trim()), n = 0;
    document.querySelectorAll('[data-search]').forEach(function(x){
      var hit = !v || norm(x.dataset.search).indexOf(v) >= 0;
      x.classList.toggle('hide', !hit); if (hit && v) n++;
    });
    document.querySelectorAll('.grp').forEach(function(g){ g.classList.toggle('hide', !!v && !g.querySelector('.card:not(.hide)')); });
    document.getElementById('dia').classList.toggle('hide', !!v);
    count.textContent = v ? (n ? n + ' resultado' + (n > 1 ? 's' : '') : 'Nada encontrado. Tente outra palavra ou pergunte ao Jarvis em português.') : '';
  });
  document.addEventListener('keydown', function(e){
    if (e.key === '/' && document.activeElement !== q){ e.preventDefault(); q.focus(); }
    if (e.key === 'Escape' && document.activeElement === q){ q.value = ''; q.dispatchEvent(new Event('input')); }
  });

  // Copiar exemplo
  document.addEventListener('click', function(e){
    var b = e.target.closest('.cp'); if (!b) return;
    var txt = b.getAttribute('data-copy');
    function ok(){ b.textContent = 'copiado'; setTimeout(function(){ b.textContent = 'copiar'; }, 1400); }
    try {
      navigator.clipboard.writeText(txt).then(ok, function(){ selectLine(b); });
    } catch(_) { selectLine(b); }
  });
  function selectLine(b){
    var r = document.createRange(); r.selectNodeContents(b.previousElementSibling);
    var s = getSelection(); s.removeAllRanges(); s.addRange(r); b.textContent = 'Ctrl+C';
  }
})();
</script>
